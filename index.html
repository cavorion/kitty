
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dear Kitty</title>

  <style>
    :root{
      --bg:#070A0F;
      --panel:#0D1320;
      --text:#E9EEF7;
      --muted:#AAB6CC;
      --line:#1D2740;
      --accent:#34C9FF;
      --accent2:#6AA9FF;
      --sos:#FF3B30;
    }

    *{ box-sizing:border-box; }
    body{
      margin:0;
      background:
        radial-gradient(circle at 35% 20%, rgba(52,201,255,0.12), transparent 40%),
        radial-gradient(circle at 75% 70%, rgba(106,169,255,0.10), transparent 45%),
        var(--bg);
      color:var(--text);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Inter, Arial, sans-serif;
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:18px;
    }

    .card{
      width:min(920px, 100%);
      background: linear-gradient(180deg, rgba(13,19,32,0.92), rgba(13,19,32,0.85));
      border:1px solid var(--line);
      border-radius:18px;
      padding:22px;
      box-shadow: 0 18px 40px rgba(0,0,0,0.45);
      position:relative;
      z-index:1;
    }

    .header{
      display:flex;
      justify-content:space-between;
      gap:14px;
      padding-bottom:14px;
      border-bottom:1px solid var(--line);
      margin-bottom:14px;
    }

    .title{
      font-size:34px;
      letter-spacing:0.04em;
      font-weight:700;
      margin:0;
    }

    .subtitle{
      margin-top:6px;
      font-size:14px;
      color:var(--muted);
      max-width:52ch;
    }

    .dear{
      font-size:22px;
      margin:14px 0 10px;
    }
    .dear span{
      color:var(--accent);
      font-weight:700;
    }

    textarea{
      width:100%;
      min-height:280px;
      resize:none;
      background: rgba(7,10,15,0.55);
      border:1px solid var(--line);
      border-radius:14px;
      padding:14px;
      font-size:18px;
      line-height:1.5;
      color:var(--text);
      outline:none;
    }

    .footer{
      display:flex;
      justify-content:space-between;
      margin-top:14px;
    }

    .btns{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      justify-content:flex-end;
    }

    .btn{
      min-width:160px;
      padding:12px 14px;
      border-radius:14px;
      border:1px solid var(--line);
      background: rgba(255,255,255,0.03);
      color:var(--text);
      font-size:18px;
      font-weight:700;
      cursor:pointer;
    }

    .btn small{
      display:block;
      font-size:12px;
      font-weight:500;
      margin-top:4px;
      color:var(--muted);
    }

    .btn.primary{ background: rgba(52,201,255,0.08); }
    .btn.earth{ background: rgba(106,169,255,0.08); }
    .btn.sos{
      background: rgba(255,59,48,0.10);
      border-color: rgba(255,59,48,0.45);
      color:#FFECEC;
    }

    .fieldRow{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
    }
    .fieldRow input{
      width:220px;
      padding:8px 10px;
      background: rgba(7,10,15,0.6);
      border:1px solid var(--line);
      border-radius:10px;
      color:var(--text);
    }

    .brandFaint{
      text-align:right;
      font-size:11px;
      letter-spacing:0.22em;
      color: rgba(170,182,204,0.35);
      margin-top:10px;
    }

    /* ===== SOS OVERLAY ===== */
    .sosOverlay{
      position:fixed;
      inset:0;
      background:#000;
      display:none;
      align-items:center;
      justify-content:center;
      flex-direction:column;
      gap:18px;
      z-index:9999;
    }

    .sosOverlay h1{
      font-size:86px;
      letter-spacing:0.1em;
      margin:0;
      color:var(--sos);
    }

    .sosOverlay p{
      color:#fff;
      opacity:0.8;
      margin:0;
      font-size:16px;
    }
  </style>
</head>

<body>

<div class="card">

  <div class="header">
    <div>
      <h1 class="title">DEAR KITTY</h1>
      <div class="subtitle">A private space. Nothing is analysed. Nothing is sent unless you choose.</div>
    </div>

    <div class="fieldRow">
      <input id="witnessInput" placeholder="Witness (optional)" />
      <input id="fromName" placeholder="From (optional)" />
      <input id="earthEmail" type="email" placeholder="To Earth (email)" />
    </div>
  </div>

  <div class="dear">Dear <span id="witnessName">Kitty</span>,</div>
  <textarea id="entry" placeholder="Write here…"></textarea>

  <div class="footer">
    <div class="btns">
      <button class="btn primary" id="saveBtn">SAVE</button>
      <button class="btn" id="checkinBtn">CHECK-IN</button>
      <button class="btn earth" id="sendEarthBtn">SEND TO EARTH</button>
      <button class="btn sos" id="sosBtn">SOS</button>
    </div>
  </div>

  <div class="brandFaint">CAVOID</div>
</div>

<!-- SOS OVERLAY -->
<div class="sosOverlay" id="sosOverlay">
  <h1>SOS</h1>
  <p>Emergency signal active.</p>
  <button class="btn" id="exitSosBtn" style="min-width:220px;">
    EXIT SOS
    <small>Return to journal</small>
  </button>
</div>

<script>
document.addEventListener('DOMContentLoaded', () => {

  const entry = document.getElementById('entry');
  const witnessInput = document.getElementById('witnessInput');
  const fromName = document.getElementById('fromName');
  const earthEmail = document.getElementById('earthEmail');
  const witnessName = document.getElementById('witnessName');

  const saveBtn = document.getElementById('saveBtn');
  const checkinBtn = document.getElementById('checkinBtn');
  const sendEarthBtn = document.getElementById('sendEarthBtn');

  const sosBtn = document.getElementById('sosBtn');
  const sosOverlay = document.getElementById('sosOverlay');
  const exitSosBtn = document.getElementById('exitSosBtn');

  witnessInput.addEventListener('input', e => {
    witnessName.textContent = e.target.value || "Kitty";
  });

  saveBtn.onclick = () => {
    alert("Saved locally. Nothing sent.");
  };

  checkinBtn.onclick = () => {
    if(!earthEmail.value) return alert("Add a To Earth email.");

    const body = encodeURIComponent(
      `Witness: ${witnessInput.value || "Kitty"}\n` +
      `From: ${fromName.value || "Chi"}\n` +
      `Timestamp: ${new Date().toISOString()}\n\n` +
      `Check-in only.`
    );

    window.location.href =
      `mailto:${earthEmail.value}?subject=CAVOID Check-in&body=${body}`;
  };

  sendEarthBtn.onclick = () => {
    if(!earthEmail.value) return alert("Add a To Earth email.");

    const body = encodeURIComponent(
      `Witness: ${witnessInput.value || "Kitty"}\n` +
      `From: ${fromName.value || "Chi"}\n` +
      `Timestamp: ${new Date().toISOString()}\n\n` +
      entry.value
    );

    window.location.href =
      `mailto:${earthEmail.value}?subject=Dear Kitty — message&body=${body}`;
  };

  /* ===== SOS LOGIC (RESTORED) ===== */
  sosBtn.onclick = () => {
    const ok = confirm(
      "Activate SOS?\nThis will display an emergency signal on screen."
    );
    if (ok) sosOverlay.style.display = 'flex';
  };

  exitSosBtn.onclick = () => {
    sosOverlay.style.display = 'none';
  };

});
</script>

</body>
</html>
